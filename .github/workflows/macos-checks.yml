name: Mac checks and package

# The release workflow was the only Mac run, so Mac-only failures (rc16 tests,
# BUG-010 update certificates) surfaced at release time. This builds the same
# Apple-chip package on every pull request and publishes nothing.
on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same interpreter as the release build, so the package uses the same Tk 8.6.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Complete Python and JavaScript checks
        run: python -X utf8 check.py --python-timeout 600
      - name: Build native application from this commit
        run: python -X utf8 build_desktop.py --output-dir dist/native --work-dir build/native
      - name: Check frozen runtime without python.org certificates, bookmark and relocation
        run: python -X utf8 .github/native_package_check.py
      - name: Keep the checked package for manual window checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-check-${{ github.sha }}
          path: dist/upload/
          if-no-files-found: error
          retention-days: 7
