name: Windows synthetic checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Python, JavaScript and real CMD checks
        run: python -X utf8 check.py
      - name: Source runtime self-test
        run: python -X utf8 desktop.py --data-root "${{ runner.temp }}/shsmu-source-data" --self-test "${{ runner.temp }}/shsmu-self-test.json"
      - name: Show self-test evidence
        if: always()
        run: Get-Content "${{ runner.temp }}/shsmu-self-test.json"
