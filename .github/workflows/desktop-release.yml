name: Build and publish rc16 desktop packages

on:
  push:
    branches: ['codex/release-rc16']

permissions:
  contents: read

# Keep build inputs byte-identical on both runners. CMD blobs retain their
# existing CRLF through the repository's explicit -text attribute.
env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf

concurrency:
  group: desktop-rc16-release
  cancel-in-progress: false

jobs:
  native:
    name: Native checks and package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Complete Python, JavaScript and applicable CMD checks
        run: python -X utf8 check.py --python-timeout 600
      # Optional repository variables UPDATE_MANIFEST_URLS / UPDATE_FILE_URLS:
      # HTTPS URL templates, one per line, tried in order ({version}, {name}).
      # Manifest URLs must serve latest-signed.json; any host may, since the
      # app checks the signature. Unset means the GitHub defaults in updater.py.
      - name: Configure update download addresses
        env:
          UPDATE_MANIFEST_URLS: ${{ vars.UPDATE_MANIFEST_URLS }}
          UPDATE_FILE_URLS: ${{ vars.UPDATE_FILE_URLS }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          lines = lambda key: tuple(v.strip() for v in os.environ.get(key, '').splitlines() if v.strip())
          manifest, files = lines('UPDATE_MANIFEST_URLS'), lines('UPDATE_FILE_URLS')
          if manifest or files:
              import updater
              sources = updater.validate_sources({'manifest': manifest, 'files': files})
              with open('update_sources.py', 'w', encoding='utf-8') as out:
                  out.write('SOURCES = %r\n' % sources)
              print('update sources:', sources)
          else:
              print('update sources: GitHub defaults')
          PY
      - name: Build native application from this commit
        run: python -X utf8 build_desktop.py --output-dir dist/native --work-dir build/native
      - name: Check frozen runtime, generated bookmark and relocation
        run: python -X utf8 .github/native_package_check.py
      - name: Upload verified native component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}-rc16
          path: dist/upload/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Verify identical sources and assemble downloads
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-rc16
          path: artifacts/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-rc16
          path: artifacts/macos
      - name: Compare source manifests and bookmark bytes, create ZIPs, checksums and signed manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python -X utf8 .github/assemble_release.py
      - name: Upload reviewed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc16-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish new candidate after both native checks pass
    needs: assemble
    if: github.repository == 'lhwen686/shsmu-schedule-sync' && github.ref == 'refs/heads/codex/release-rc16'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rc16-release-assets
          path: release-assets
      - name: Verify every downloaded asset
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Create a new prerelease without replacing old attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create v1.0.0-rc16 release-assets/* \
            --target "$RELEASE_COMMIT" --prerelease \
            --title "医学院课表助手 rc16 · 应用内更新、界面刷新与逐条读取" \
            --notes-file RELEASE_NOTES.md
      - name: Verify published asset names and exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v1.0.0-rc16 --dir published-assets
          python - <<'PY'
          from pathlib import Path
          expected = Path('release-assets')
          downloaded = Path('published-assets')
          assert {p.name for p in expected.iterdir()} == {p.name for p in downloaded.iterdir()}
          for path in expected.iterdir():
              assert path.read_bytes() == (downloaded / path.name).read_bytes(), path.name
          print('PASS: all published names and bytes match the reviewed assets')
          PY
      - name: Point the GitHub update channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view update-channel >/dev/null 2>&1 || gh release create update-channel \
            --prerelease --title "自动更新通道（请勿删除）" \
            --notes "助手内“检查更新”读取本页的 latest.json。安装包请到各版本发布页下载。"
          gh release upload update-channel release-assets/latest.json release-assets/latest-signed.json --clobber
      # After GitHub, so a COS failure never blocks GitHub users. Apps try COS
      # first; a stale COS channel is skipped because they then ask GitHub too.
      - name: Mirror downloads and the signed update channel to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('release-assets/latest.json'))['version'])")
          bash .github/publish_cos.sh release-assets "$version"
